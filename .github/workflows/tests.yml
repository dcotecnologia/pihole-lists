name: Tests
on:
    pull_request:
    push:
        branches:
            - master
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Python
              id: setup-python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
            - name: Setup uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
                  cache-dependency-glob: |
                      uv.lock
                      pyproject.toml
            - name: Cache virtual environment
              uses: actions/cache@v5
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
                  restore-keys: |
                      venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
            - name: Install dependencies
              run: uv sync --all-groups --no-install-project
            - name: Run tests
              run: uv run pytest -q
            - name: Upload coverage xml
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-xml
                  path: coverage.xml
