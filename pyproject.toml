[project]
name = "pihole-lists"
version = "1.3.0"
description = "Adlists to complete your pi-hole server"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
	"coloredlogs>=15.0.1",
	"dnspython>=2.8.0",
	"pyyaml>=6.0.3",
	"validators>=0.35.0",
	"requests>=2.32.5",
]

[dependency-groups]
dev = [
	"pytest>=9.0.2",
	"pytest-cov>=7.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88
profile = "black"

[tool.black]
line-length = 120
extend-exclude = '''
(
/.*__snapshots/.*output\.py # exclude the simple snapshot outputs
)
'''

[tool.docformatter]
black = true
non-strict = false
non-cap = ["docformatter"]

[tool.flake8]
max-line-length = 120

[tool.pycodestyle]
max-line-length = 120

[tool.mypy]
python_version = 3.12
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
line-length = 160
target-version = "py314"
exclude = ["common/core/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["app", "common", "easetrack"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "WARNING"
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -s --cov=src --log-level=WARN --strict-markers --tb=short --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --cov-config=pyproject.toml"
markers = [
    "slow: mark test as slow to run",
    "integration: integration test",
    "unit: unit test",
    "api: API test",
    "auth: authentication related",
]

[tool.coverage.run]
branch = false
source = ["src"]
omit = ["**/*/__init__.py", "tests/*", "setup.py", "conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
