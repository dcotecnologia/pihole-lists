[project]
name = "pihole-lists"
version = "1.4.1"
description = "Adlists to complete your pi-hole server"
authors = [{ name = "Danilo Carolino", email = "danilogcarolino@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
	"dnspython>=2.9.0",
	"pyyaml>=6.0.3",
	"validators>=0.35.0",
	"requests>=2.34.2",
	"tldextract>=5.4.0",
]

[dependency-groups]
dev = [
	"pytest>=9.1.1",
	"pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.docformatter]
black = true
non-strict = false
non-cap = ["docformatter"]

# Single lint/format standard for every Python project in this repo (root
# and webapp/api): ruff. webapp/api's pyproject.toml has no [tool.ruff]
# section of its own on purpose, so it inherits this one - see
# .claude/COMMITS.md-adjacent note in webapp/api/pyproject.toml.
[tool.ruff]
line-length = 160
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["common", "settings", "app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "WARNING"
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib -s --cov=src --log-level=WARN --strict-markers --tb=short --cov-report=term-missing --cov-report=xml --cov-fail-under=100 --cov-config=pyproject.toml"
markers = [
    "slow: mark test as slow to run",
    "integration: integration test",
    "unit: unit test",
    "api: API test",
    "auth: authentication related",
]

[tool.coverage.run]
branch = false
source = ["src"]
omit = ["**/*/__init__.py", "tests/*", "setup.py", "conftest.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
